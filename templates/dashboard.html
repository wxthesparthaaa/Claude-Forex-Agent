<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Forex Agent</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      background: #faf9f5;
      color: #1a1a1a;
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    .status { color: #666; font-size: 0.9rem; }
    .card {
      border: 1px solid #e5e3da;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-top: 1.5rem;
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>Claude Forex Agent</h1>
  <p class="status">Skeleton deployed — strategy modules not wired up yet.</p>
  <div class="card">
    <strong>Status:</strong> {{ status }}
  </div>
</body>
</html>
